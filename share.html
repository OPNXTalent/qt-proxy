<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Prism</title>
<meta name="robots" content="noindex">
<!--
  This file used to be a full second implementation of the Refractions
  panel, chamber header, R-numbering, Trust Circle, and notes — a copy of
  qt.html's UI, built and maintained separately. That's the drift this
  redirect eliminates: qt.html now renders a shared thread directly,
  through its own real pipeline (see loadSharedThread() there), so every
  ?t=TOKEN link — old or new — lands on the one real implementation
  instead of a second one that could silently fall out of sync with it.

  This page's only job is to preserve already-distributed
  share.html?t=TOKEN links. Nothing here should ever need to change again
  short of the redirect target itself moving.
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06060a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    color: #7a7890;
  }
  .redirect-note {
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="redirect-note" id="redirectNote">Opening&hellip;</div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token  = params.get('t');
      if (!token) {
        document.getElementById('redirectNote').textContent = 'This link appears to be incomplete. Please check the original invitation.';
        return;
      }
      window.location.replace('/qt.html?mode=anon&t=' + encodeURIComponent(token));
    })();
  </script>
</body>
</html>
