name: Apply crisis continuation repair

on:
  push:
    branches:
      - fix/crisis-continuation-resume

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crisis-continuation-resume
          fetch-depth: 0

      - name: Patch continuation contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # --- Server: crisis acknowledgement bypasses only the crisis intercept.
          # Child-abuse interception remains unconditional and is evaluated first.
          api_path = Path('api/interpret.js')
          api = api_path.read_text(encoding='utf-8')
          old = """  if (detectCrisis(lastUserText)) {\n    timing('safety_complete', { outcome: 'crisis_intercept' });\n    return res.status(200).json({ crisis: true });\n  }\n  timing('safety_complete', { outcome: 'clear' });"""
          new = """  const crisisAcknowledged = req.body?.crisisAcknowledged === true;\n  if (!crisisAcknowledged && detectCrisis(lastUserText)) {\n    timing('safety_complete', { outcome: 'crisis_intercept' });\n    return res.status(200).json({ crisis: true });\n  }\n  timing('safety_complete', { outcome: crisisAcknowledged ? 'crisis_acknowledged' : 'clear' });"""
          if old not in api:
              raise SystemExit('interpret.js crisis block did not match expected source')
          api = api.replace(old, new, 1)
          api_path.write_text(api, encoding='utf-8')

          # --- Client: turn the safety panel into a pause/resume boundary rather than a terminal intercept.
          qt_path = Path('qt.html')
          qt = qt_path.read_text(encoding='utf-8')

          old_sig = 'async function callProxy(messages, rawQuery, requestId) {'
          new_sig = 'async function callProxy(messages, rawQuery, requestId, options) {\n  options = options || {};'
          if old_sig not in qt:
              raise SystemExit('callProxy signature did not match expected source')
          qt = qt.replace(old_sig, new_sig, 1)

          old_payload = """        rawQuery: rawQuery || '',\n        debugMode: getTheodicyDebugMode(),\n        requestId"""
          new_payload = """        rawQuery: rawQuery || '',\n        crisisAcknowledged: options.crisisAcknowledged === true,\n        debugMode: getTheodicyDebugMode(),\n        requestId"""
          if old_payload not in qt:
              raise SystemExit('callProxy payload did not match expected source')
          qt = qt.replace(old_payload, new_payload, 1)

          crisis_branch = re.compile(
              r"if \(bodyData\.crisis\) \{\s*showCrisisPanel\(\);\s*throw new Error\('CRISIS_DETECTED'\);\s*\}",
              re.M,
          )
          replacement = """if (bodyData.crisis) {\n      await showCrisisPanel();\n      return callProxy(messages, rawQuery, requestId, { crisisAcknowledged: true });\n    }"""
          qt, count = crisis_branch.subn(replacement, qt, count=1)
          if count != 1:
              raise SystemExit(f'expected one crisis response branch, found {count}')

          start_marker = '// ── CRISIS PANEL'
          end_marker = '// ── CHILD ABUSE PANEL'
          start = qt.find(start_marker)
          end = qt.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('crisis panel section markers not found')
          section = qt[start:end]

          if 'var _crisisContinueResolver = null;' not in section:
              section = section.replace(
                  'function showCrisisPanel() {',
                  'var _crisisContinueResolver = null;\n\nfunction showCrisisPanel() {',
                  1,
              )

          scroll_line = "  document.getElementById('resultContent').scrollIntoView({ behavior: 'smooth', block: 'start' });\n}"
          if scroll_line not in section:
              raise SystemExit('showCrisisPanel closing sequence not found')
          section = section.replace(
              scroll_line,
              """  document.getElementById('resultContent').scrollIntoView({ behavior: 'smooth', block: 'start' });\n\n  return new Promise(function(resolve) {\n    _crisisContinueResolver = resolve;\n  });\n}""",
              1,
          )

          dismiss_pattern = re.compile(
              r"function dismissCrisisPanel\(\) \{.*?\n\}",
              re.S,
          )
          match = dismiss_pattern.search(section)
          if not match:
              raise SystemExit('dismissCrisisPanel function not found')
          old_dismiss = match.group(0)
          new_dismiss = """function dismissCrisisPanel() {\n  var continueInquiry = _crisisContinueResolver;\n  _crisisContinueResolver = null;\n  var panel = document.getElementById('crisisPanel');\n\n  var resume = function() {\n    if (!continueInquiry) {\n      document.getElementById('resultBlock').classList.remove('visible');\n      document.getElementById('userInput').focus();\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n      return;\n    }\n\n    // The person explicitly chose to continue. Restore the ordinary in-flight\n    // query state before resolving the paused callProxy() promise.\n    document.getElementById('resultBlock').classList.remove('visible');\n    document.getElementById('loadingBlock').classList.add('visible');\n    document.getElementById('inputSection').style.opacity = '0.45';\n    document.getElementById('inputSection').style.pointerEvents = 'none';\n    document.getElementById('submitBtn').disabled = true;\n    continueInquiry();\n  };\n\n  if (panel) {\n    panel.style.transition = 'opacity 0.4s ease';\n    panel.style.opacity = '0';\n    setTimeout(function() {\n      if (panel.parentNode) panel.parentNode.removeChild(panel);\n      resume();\n    }, 400);\n  } else {\n    resume();\n  }\n}"""
          section = section.replace(old_dismiss, new_dismiss, 1)
          qt = qt[:start] + section + qt[end:]
          qt_path.write_text(qt, encoding='utf-8')

          test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const api = fs.readFileSync(new URL('../api/interpret.js', import.meta.url), 'utf8');
          const qt = fs.readFileSync(new URL('../qt.html', import.meta.url), 'utf8');

          test('crisis acknowledgement resumes interpretation without weakening child-abuse intercept', () => {
            const childPos = api.indexOf('if (detectChildAbuse(lastUserText))');
            const ackPos = api.indexOf("const crisisAcknowledged = req.body?.crisisAcknowledged === true;");
            const crisisPos = api.indexOf('if (!crisisAcknowledged && detectCrisis(lastUserText))');
            assert.ok(childPos >= 0, 'child-abuse intercept missing');
            assert.ok(ackPos > childPos, 'crisis acknowledgement must be evaluated after child-abuse interception');
            assert.ok(crisisPos > ackPos, 'crisis detector must be gated by explicit acknowledgement');
          });

          test('client pauses at safety panel and retries the same inquiry only after Continue', () => {
            assert.match(qt, /async function callProxy\(messages, rawQuery, requestId, options\)/);
            assert.match(qt, /crisisAcknowledged: options\.crisisAcknowledged === true/);
            assert.match(qt, /if \(bodyData\.crisis\) \{\s*await showCrisisPanel\(\);\s*return callProxy\(messages, rawQuery, requestId, \{ crisisAcknowledged: true \}\);/s);
            assert.match(qt, /return new Promise\(function\(resolve\) \{\s*_crisisContinueResolver = resolve;/s);
            assert.match(qt, /var continueInquiry = _crisisContinueResolver;[\s\S]*continueInquiry\(\);/);
          });
          '''
          # Remove indentation introduced by the workflow heredoc.
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('tests/test-crisis-continuation-contract.mjs').write_text(test, encoding='utf-8')

          # This workflow is only a transport for applying a targeted patch through
          # the connected GitHub account. Remove it from the resulting branch.
          Path('.github/workflows/apply-crisis-continuation.yml').unlink()
          PY

      - name: Run focused regression
        run: node --test tests/test-crisis-continuation-contract.mjs

      - name: Run full regression suite
        run: node --test tests/*.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/interpret.js qt.html tests/test-crisis-continuation-contract.mjs .github/workflows/apply-crisis-continuation.yml
          git commit -m "fix(safety): resume inquiry after crisis acknowledgement"
          git push origin HEAD:fix/crisis-continuation-resume
