name: Temporary runtime archive repair

on:
  push:
    branches:
      - agent/persistent-inquiry-runtime
    paths:
      - .github/workflows/runtime-archive-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-inquiry-runtime
          fetch-depth: 0

      - name: Apply focused repairs and regression checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          qt_path = Path('qt.html')
          qt = qt_path.read_text()

          qt = replace_once(
              qt,
              """            } else if (parsed.type === 'canonical_complete') {
              canonicalAvailable = true;
              tierFromStream = parsed.tier || tierFromStream;
              acceptInquiryCredential(parsed);
              if (parsed.threadId) activeThreadId = parsed.threadId;
              document.getElementById('subjectText').textContent = rawQuery || currentSubject || '';
""",
              """            } else if (parsed.type === 'canonical_complete') {
              canonicalAvailable = true;
              tierFromStream = parsed.tier || tierFromStream;
              acceptInquiryCredential(parsed);
              if (parsed.threadId) {
                activeThreadId = parsed.threadId;
                // Canonical completion is the persistence milestone. Surface the
                // durable thread immediately while deeper Prism Analysis continues.
                showSidebarAfterQuery(rawQuery || currentSubject || '', parsed.threadId, progressiveResult);
              }
              document.getElementById('subjectText').textContent = rawQuery || currentSubject || '';
""",
              'live canonical Archive handoff',
          )

          qt = replace_once(
              qt,
              """            } else if (parsed.type === 'canonical_complete') {
              canonicalAvailable = true;
              tierFromStream = parsed.tier || tierFromStream;
              acceptInquiryCredential(parsed);
            } else if (parsed.type === 'delta' && parsed.text) {
""",
              """            } else if (parsed.type === 'canonical_complete') {
              canonicalAvailable = true;
              tierFromStream = parsed.tier || tierFromStream;
              acceptInquiryCredential(parsed);
              if (parsed.threadId) {
                activeThreadId = parsed.threadId;
                showSidebarAfterQuery(rawQuery || currentSubject || '', parsed.threadId, progressiveResult);
              }
            } else if (parsed.type === 'delta' && parsed.text) {
""",
              'buffered canonical Archive handoff',
          )

          qt = replace_once(
              qt,
              """    showSidebarAfterQuery(queryText, activeThreadId);
""",
              """    showSidebarAfterQuery(queryText, activeThreadId, parsed);
""",
              'final Archive enrichment handoff',
          )

          old_add = """function addThreadToSidebar(queryText, threadId) {
  var tsNow = Date.now(), tempId = 'pending-' + tsNow;
  var id = threadId || tempId;
  allThreads.unshift({ id: id, title: queryText.length > 60 ? queryText.slice(0, 60) + '\\u2026' : queryText,
    query: queryText, lastVisited: formatNow(), createdAt: tsNow,
    daysLeft: TIER_RETENTION[CURRENT_TIER] || 90, expired: false, response: null });
  activeThreadId = id;
  renderThreads(allThreads);

  if (threadId) {
    localStorage.setItem('qt_last_thread_id', threadId);
    if (typeof startFollowUpRealtime === 'function') {
      startFollowUpRealtime(threadId);
    }
    return;
  }
"""
          new_add = """function addThreadToSidebar(queryText, threadId, responseData) {
  var tsNow = Date.now(), tempId = 'pending-' + tsNow;
  var id = threadId || tempId;
  var existingIndex = allThreads.findIndex(function(thread) { return thread.id === id; });
  var existing = existingIndex >= 0 ? allThreads[existingIndex] : null;
  var safeQuery = queryText || (existing ? existing.query : '') || '';
  var title = existing && existing.title
    ? existing.title
    : (safeQuery.length > 60 ? safeQuery.slice(0, 60) + '\\u2026' : safeQuery);
  var record = Object.assign({}, existing || {}, {
    id: id,
    title: title,
    query: safeQuery,
    lastVisited: formatNow(),
    createdAt: existing && existing.createdAt ? existing.createdAt : tsNow,
    daysLeft: existing && existing.daysLeft != null ? existing.daysLeft : (TIER_RETENTION[CURRENT_TIER] || 90),
    expired: existing ? !!existing.expired : false,
    response: responseData || (existing ? existing.response : null) || null
  });
  // Durable completion can arrive once at the canonical boundary and again
  // after enrichment. Upsert by ID so those milestones can never duplicate it.
  if (existingIndex >= 0) allThreads.splice(existingIndex, 1);
  allThreads.unshift(record);
  activeThreadId = id;
  renderThreads(allThreads);

  if (threadId) {
    localStorage.setItem('qt_last_thread_id', threadId);
    if (responseData) {
      try {
        localStorage.setItem('qt_response_' + threadId, JSON.stringify(responseData));
        localStorage.setItem('qt_input_' + threadId, safeQuery);
      } catch (_) {}
    }
    if (typeof startFollowUpRealtime === 'function') {
      startFollowUpRealtime(threadId);
    }
    return;
  }
"""
          qt = replace_once(qt, old_add, new_add, 'Archive durable-ID upsert')

          qt = replace_once(
              qt,
              """function showSidebarAfterQuery(queryText, threadId) {
""",
              """function showSidebarAfterQuery(queryText, threadId, responseData) {
""",
              'Archive handoff signature',
          )
          qt = replace_once(
              qt,
              """  addThreadToSidebar(queryText, threadId);
}

// TOGGLE SIDEBAR
""",
              """  addThreadToSidebar(queryText, threadId, responseData);
}

// TOGGLE SIDEBAR
""",
              'Archive handoff response pass-through',
          )
          qt_path.write_text(qt)

          interpret_path = Path('api/interpret.js')
          interpret = interpret_path.read_text()
          old_core = """  let started = Date.now();
  timing('artifact_construction_start');
  const rawCoreText = await callInquiryModel({
    model: 'claude-sonnet-4-6',
    maxTokens: 1800,
    temperature: 0.2,
    timeoutMs: 45000,
    system: progressiveSystemPrompt(systemPrompt, PRISM_ARTIFACT_CORE_CONTRACT),
    prompt: query,
  });
  let rawCore;
  try {
    rawCore = parseModelJson(rawCoreText);
  } catch (error) {
    timing('artifact_json_repair_start', {
      reason: error?.message || 'MODEL_JSON_INVALID',
      candidateChars: rawCoreText.length,
    });
    const repairedCore = await callInquiryModel({
      model: 'claude-haiku-4-5-20251001',
      maxTokens: 3000,
      timeoutMs: 20000,
      system: PRISM_ARTIFACT_CORE_CONTRACT,
      prompt: `Repair serialization only. Convert the candidate below into the exact JSON contract without changing its substantive interpretation, thesis, conclusions, qualifications, or canonical response. Fill only structurally required fields from the query when absent. Return JSON only.\\n\\nQuery:\\n${query}\\n\\nCandidate:\\n${rawCoreText}`,
      structuredOutputSchema: PRISM_ARTIFACT_CORE_SCHEMA,
      structuredOutputName: 'emit_interpretation_artifact',
      structuredOutputDiagnostic: diagnostic => timing('artifact_structured_output_diagnostic', diagnostic),
    });
    rawCore = repairedCore;
    timing('artifact_json_repair_complete', {
      candidateChars: rawCoreText.length,
      repairedChars: JSON.stringify(repairedCore).length,
      boundary: 'forced_tool_schema',
    });
  }
"""
          new_core = """  let started = Date.now();
  timing('artifact_construction_start');
  let rawCoreText = '';
  let rawCore = null;
  try {
    rawCoreText = await callInquiryModel({
      model: 'claude-sonnet-4-6',
      maxTokens: 1800,
      temperature: 0.2,
      timeoutMs: 45000,
      system: progressiveSystemPrompt(systemPrompt, PRISM_ARTIFACT_CORE_CONTRACT),
      prompt: query,
    });
  } catch (error) {
    if (error?.message !== 'INQUIRY_MODEL_OUTPUT_TRUNCATED') throw error;
    timing('artifact_truncation_retry_start', { maxTokens: 3600 });
    rawCore = await callInquiryModel({
      model: 'claude-sonnet-4-6',
      maxTokens: 3600,
      temperature: 0.2,
      timeoutMs: 60000,
      system: progressiveSystemPrompt(systemPrompt, PRISM_ARTIFACT_CORE_CONTRACT),
      prompt: query,
      structuredOutputSchema: PRISM_ARTIFACT_CORE_SCHEMA,
      structuredOutputName: 'emit_interpretation_artifact',
      structuredOutputDiagnostic: diagnostic => timing('artifact_structured_output_diagnostic', {
        ...diagnostic,
        recovery: 'truncation_retry',
      }),
    });
    timing('artifact_truncation_retry_complete', {
      artifactChars: JSON.stringify(rawCore).length,
      boundary: 'forced_tool_schema',
    });
  }
  if (!rawCore) {
    try {
      rawCore = parseModelJson(rawCoreText);
    } catch (error) {
      timing('artifact_json_repair_start', {
        reason: error?.message || 'MODEL_JSON_INVALID',
        candidateChars: rawCoreText.length,
      });
      const repairedCore = await callInquiryModel({
        model: 'claude-haiku-4-5-20251001',
        maxTokens: 3000,
        timeoutMs: 20000,
        system: PRISM_ARTIFACT_CORE_CONTRACT,
        prompt: `Repair serialization only. Convert the candidate below into the exact JSON contract without changing its substantive interpretation, thesis, conclusions, qualifications, or canonical response. Fill only structurally required fields from the query when absent. Return JSON only.\\n\\nQuery:\\n${query}\\n\\nCandidate:\\n${rawCoreText}`,
        structuredOutputSchema: PRISM_ARTIFACT_CORE_SCHEMA,
        structuredOutputName: 'emit_interpretation_artifact',
        structuredOutputDiagnostic: diagnostic => timing('artifact_structured_output_diagnostic', diagnostic),
      });
      rawCore = repairedCore;
      timing('artifact_json_repair_complete', {
        candidateChars: rawCoreText.length,
        repairedChars: JSON.stringify(repairedCore).length,
        boundary: 'forced_tool_schema',
      });
    }
  }
"""
          interpret = replace_once(interpret, old_core, new_core, 'initial artifact truncation retry')
          interpret_path.write_text(interpret)

          frontend_test_path = Path('tests/test-frontend-query-handoff.mjs')
          frontend_test = frontend_test_path.read_text()
          frontend_assertions = """assert.match(
  qtSource,
  /canonical_complete'[\\s\\S]*?showSidebarAfterQuery\\(rawQuery \\|\\| currentSubject \\|\\| '', parsed\\.threadId, progressiveResult\\)/,
  'Canonical completion must surface the durable thread in Archive before enrichment finishes',
);
assert.match(
  qtSource,
  /function addThreadToSidebar\\(queryText, threadId, responseData\\)[\\s\\S]*?findIndex\\(function\\(thread\\) \\{ return thread\\.id === id; \\}\\)[\\s\\S]*?allThreads\\.splice\\(existingIndex, 1\\)[\\s\\S]*?allThreads\\.unshift\\(record\\)/,
  'Archive insertion must upsert by durable thread ID instead of duplicating completion milestones',
);
assert.match(
  qtSource,
  /showSidebarAfterQuery\\(queryText, activeThreadId, parsed\\)/,
  'Final enrichment must update the existing durable Archive entry with the completed response',
);

"""
          frontend_test = replace_once(
              frontend_test,
              "console.log('Frontend query handoff checks passed.');\n",
              frontend_assertions + "console.log('Frontend query handoff checks passed.');\n",
              'frontend regression assertions',
          )
          frontend_test_path.write_text(frontend_test)

          progressive_test_path = Path('tests/test-progressive-inquiry-delivery.mjs')
          progressive_test = progressive_test_path.read_text()
          progressive_test = replace_once(
              progressive_test,
              "import { readFileSync } from 'node:fs';\n" if "import { readFileSync } from 'node:fs';\n" in progressive_test else "import assert from 'node:assert/strict';\n",
              "import { readFileSync } from 'node:fs';\n" if "import { readFileSync } from 'node:fs';\n" in progressive_test else "import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n",
              'progressive test source import',
          )
          retry_assertions = """const interpretSource = readFileSync(new URL('../api/interpret.js', import.meta.url), 'utf8');
const artifactConstructionSource = interpretSource.match(
  /async function constructAuditedArtifact\\([\\s\\S]*?return artifact;\\n\\}/,
)?.[0] || '';
assert.match(
  artifactConstructionSource,
  /error\\?\\.message !== 'INQUIRY_MODEL_OUTPUT_TRUNCATED'/,
  'Only the exact initial artifact truncation condition may enter the recovery path',
);
assert.match(
  artifactConstructionSource,
  /artifact_truncation_retry_start'[\\s\\S]*?maxTokens: 3600[\\s\\S]*?structuredOutputSchema: PRISM_ARTIFACT_CORE_SCHEMA[\\s\\S]*?structuredOutputName: 'emit_interpretation_artifact'/,
  'A truncated initial artifact must retry once with a larger bounded forced-schema generation',
);

"""
          progressive_test = replace_once(
              progressive_test,
              "console.log('progressive inquiry delivery contract tests passed');\n",
              retry_assertions + "console.log('progressive inquiry delivery contract tests passed');\n",
              'artifact truncation regression assertions',
          )
          progressive_test_path.write_text(progressive_test)
          PY

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            node "$test"
          done

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-archive-repair.yml
          git config user.name "OPNX Runtime Repair"
          git config user.email "kdhogg@opnx-talent.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): sync Archive at canonical persistence"
          git push origin HEAD:agent/persistent-inquiry-runtime
