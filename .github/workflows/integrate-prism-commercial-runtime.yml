name: Integrate Prism commercial runtime

on:
  push:
    branches:
      - release/prism-commercial-integration-20260911

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/prism-commercial-integration-20260911
          fetch-depth: 0
      - name: Integrate and verify
        run: python .github/scripts/integrate_prism_release.py

# Release integration driver: reconcile, preserve production-safe deltas, verify, then commit.
